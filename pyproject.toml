[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_agent_toolkit_memanto"]

[project]
name = "nemo-agent-toolkit-memanto"
version = "0.2.0"
description = "Memanto long-term memory backend for NVIDIA NeMo Agent Toolkit"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Memanto", email = "info@memanto.ai" }]
keywords = ["ai", "agents", "memory", "nemo", "nvidia", "memanto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "memanto>=0.2.28",
  "nvidia-nat-core>=1.8,<2",
]

[project.optional-dependencies]
test = [
  "nvidia-nat-langchain>=1.8,<2",
  "nvidia-nat-test>=1.8,<2",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.urls]
documentation = "https://docs.memanto.ai"
source = "https://github.com/moorcheh-ai/NeMo-Agent-Toolkit-memanto"

[project.entry-points."nat.plugins"]
nat_memanto = "nemo_agent_toolkit_memanto.register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs MOORCHEH_API_KEY and calls the live Memanto backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true
